<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Heat Pump Sizer</title>
        <link rel="stylesheet" href="style.css">
    </head> 

    <body>
        <div class="container">
            <h1>Heat Pump Sizer</h1>
            <p>Estimate the heat pump size your home needs.</p>

            <div>
                <label for="sqft">Home square footage</label>
                <input type="number" id="sqft" value="1500">

                <label for="insulation">Insulation quality</label>
                <select id="insulation">
                    <option value="poor">Poor</option>
                    <option value="average" selected>Average</option>
                    <option value="good">Good</option>
                </select>

                <label for="windows">Number of windows</label>
                <input type="number" id="windows" value="10">

                <label for="climate">Climate zone</label>
                <select id="climate">
                    <option value="toronto" selected>Toronto</option>
                </select>
            </div>

            <div id="output">
                <p>Tons: <span id="tons">—</span></p>
                <p>Cost range: <span id="cost">—</span></p>
            </div>
        </div>
        
        <script src="script.js"></script>
    </body>
</html>
